<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="mainbox mainbox1">
        <img src="./drizzle.png"alt="drizzle-icon">
        <h1 class="weather">Weather</h1>
        <h2 class="forecasts">Forecasts</h2>
        <button class="start">Start</button>
      </div>
  <div class="mainbox mainbox2 inactive">
    <div class="searchbox">
      <input type="text" placeholder="Enter the City" id="inputfield"/>
      <div class="img"><img src="./search.png" id="searchicon"></div>
    </div>
    <div class="iconbox">
      <img src="./clear.png" id="icon"/>
      <p id="desc">Description</p>
    </div>
    <div class="tempbox">
      <h1 id="temp">0°C</h1>
      <h3 id="city">New York</h3>
    </div>
    <div class="extradetails">
      <div class="wind">
        <img src="./wind.png" id="windicon">
        <div class="winddata">
          <p id="windspeed">0km/h</p>
          <p>wind</p>
        </div>
      </div>
      <div class="humidity">
        <img src="./humidity.png" id="humidityicon">
        <div class="humiditydata">
          <p id="humidityspeed">0%</p>
          <p>humidity</p>
        </div>
      </div>
    </div>

  </div>
  <div class="mainbox mainbox3 inactive">
    <h1>404</h1>
    <p>Page not found</p>
    <p>The page you are looking for does not exist.</p>
    <button class="homebtn">Go Home</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
